# If you are tying to edit your settings do not edit this file

[service]
name = string
request_interval = float
redirect_uri = string

[theme]
name = string

[foreground]
enabled = boolean
size = integer

[background]
type = string
blur_enabled = boolean
blur_strength = float

[updates]
check_for_updates = boolean

[power]
disable_on_battery_saver = boolean

[miscellaneous]
paused = boolean

[system_theme]
sync_enabled = boolean
update_lockscreen = boolean

[default_wallpaper]
auto_refresh_enabled = boolean(default=True)
last_refresh = float(default=0.0)
