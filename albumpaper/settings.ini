[service]
name = spotify
request_interval = 10.0
redirect_uri = http://127.0.0.1:8080/

[theme]
name = Dark

[foreground]
enabled = True
size = 720

[background]
type = Colored Noise
blur_enabled = True
blur_strength = 10.0

[updates]
check_for_updates = True

[power]
disable_on_battery_saver = False

[miscellaneous]
paused = False

[system_theme]
sync_enabled = True
update_lockscreen = True

[default_wallpaper]
auto_refresh_enabled = True
last_refresh = 0.0
